name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（如 2026.8.7.1），不填则用 Directory.Build.props 里的值'
        required: false
        default: ''
      buildInstaller:
        description: '是否同时编译 Inno Setup 安装包（Setup.exe）？'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 注入 Marketing Version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.versionName }}' -ne '') {
            $ver = '${{ github.event.inputs.versionName }}'
          } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $ver = '${{ github.ref }}'.Substring('refs/tags/v'.Length)
          } else {
            return
          }
          (Get-Content Directory.Build.props) -replace '<Version>.*</Version>', "<Version>$ver</Version>" | Set-Content Directory.Build.props
          Write-Host "Version=$ver"

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = '0.0.0' }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version=$ver"

      - name: 还原依赖
        run: dotnet restore ClipSync.sln

      - name: 发布 ${{ matrix.arch }} 自包含单文件
        shell: pwsh
        run: |
          dotnet publish src/ClipSync.App/ClipSync.App.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o publish/${{ matrix.arch }}
          Write-Host "=== 产物清单 ==="
          Get-ChildItem publish/${{ matrix.arch }} | Format-Table Name, Length

      - name: 打包成 zip
        shell: pwsh
        run: |
          $zipName = "ClipSync-$env:VERSION-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "publish/${{ matrix.arch }}/*" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "已生成 $zipName ($([math]::Round((Get-Item $zipName).Length / 1MB, 2)) MB)"

      - name: （可选）编译 Inno Setup 安装包
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.buildInstaller == 'true')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --stoponfirstfailure | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Host "::error::找不到 ISCC.exe"; exit 1 }
          Write-Host "ISCC=$iscc"

          $innoDir = Split-Path $iscc
          $langFile = Join-Path $innoDir "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $langFile)) {
            Write-Host "下载简体中文语言包..."
            $urls = @(
              "https://cdn.jsdelivr.net/gh/kira-96/Inno-Setup-Chinese-Simplified-Translation@main/ChineseSimplified.isl",
              "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/main/ChineseSimplified.isl"
            )
            foreach ($u in $urls) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $langFile -UseBasicParsing -TimeoutSec 30
                if ((Test-Path $langFile) -and (Get-Item $langFile).Length -gt 5000) {
                  Write-Host "已下载中文语言包: $((Get-Item $langFile).Length) bytes"
                  break
                }
              } catch { Write-Host "下载失败: $u - $($_.Exception.Message)" }
            }
            if (-not (Test-Path $langFile)) { Write-Host "::error::中文语言包下载失败"; exit 1 }
          }

          $issPath = "installer\ClipSync.iss"
          $content = Get-Content $issPath -Raw -Encoding UTF8
          $content = $content -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$env:VERSION`""
          Set-Content $issPath -Value $content -Encoding UTF8 -NoNewline

          & $iscc "installer\ClipSync.iss" "/DArch=${{ matrix.arch }}" "/DSrcDir=..\publish\${{ matrix.arch }}\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: clip-sync-windows-${{ matrix.arch }}
          path: |
            ClipSync-*-win-${{ matrix.arch }}.zip
            installer/Output/ClipSync-Setup-*-win-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出所有产物
        run: |
          ls -lhR dist/
          echo "--- find exe ---"
          find dist -name "*.exe" -o -name "*.zip" | sort

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.versionName }}"
            [ -z "$VERSION" ] && VERSION="0.0.0"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: 检查 Release 是否已存在
        id: chk
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.RELEASE_TAG }}")
          if [ "$code" = "200" ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: 发布 Release（不存在则创建，存在则追加资产）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.RELEASE_TAG }}
          name: 'ClipSync Windows v${{ steps.ver.outputs.VERSION }}'
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/**/ClipSync-Setup-*.exe

  publish-package:
    name: 发布容器包到 GitHub Packages (ghcr.io)
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 下载所有 zip 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: clip-sync-windows-*

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.versionName }}"
            [ -z "$VERSION" ] && VERSION="0.0.0"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 打包成 OCI 容器镜像
        run: |
          STAGE=stage
          mkdir -p "$STAGE/app" "$STAGE/scratch"
          find dist -name 'ClipSync-*.zip' -exec cp {} "$STAGE/app/" \;
          find dist -name 'ClipSync-*.zip' -exec cp {} "$STAGE/scratch/" \;
          cat > "$STAGE/Dockerfile" <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.title="ClipSync Windows 安装包"
          LABEL org.opencontainers.image.description="ClipSync Windows 客户端（含 x64 / arm64 两种架构的 zip）"
          LABEL com.clipsync.role="windows-installer"
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.url="https://github.com/${{ github.repository }}"
          COPY app/ /app/
          COPY scratch/ /scratch/
          EOF
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t ghcr.io/$OWNER_LC/clipsync-windows:${{ steps.ver.outputs.VERSION }} \
                       -t ghcr.io/$OWNER_LC/clipsync-windows:latest "$STAGE"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push 容器包
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker push ghcr.io/$OWNER_LC/clipsync-windows:${{ steps.ver.outputs.VERSION }}
          docker push ghcr.io/$OWNER_LC/clipsync-windows:latest
          echo "✅ 已推 ghcr.io/$OWNER_LC/clipsync-windows"
